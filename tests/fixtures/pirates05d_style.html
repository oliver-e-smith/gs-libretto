<h3 align="center">Dialogue following No. 5</h3>
<p><b>Kate.</b> What a picturesque spot! I wonder where we are!</p>
<p><b>Edith.</b> And I wonder where Papa is. We have left him ever so far
behind.</p>
<p><i>They prepare to carry out the suggestion when FREDERIC comes forward
from cave.</i></p>
<p><b>Fred.</b> <i>(recitative)</i> Stop, ladies, pray!</p>
